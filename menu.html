<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Control - Cafetería FFyL</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f3f4f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        
        .header-panel { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #e5e7eb; padding-bottom: 15px; }
        .header-panel h1 { color: #1e3a8a; margin: 0; font-size: 24px; }
        .header-panel p { color: #6b7280; font-size: 13px; margin: 5px 0 0 0; }

        /* CONTENEDOR DEL MENÚ DINÁMICO */
        .menu-grid { display: flex; flex-direction: column; gap: 12px; }

        /* ESTILO INDIVIDUAL DE CADA OPCIÓN (BOTÓN LARGO) */
        .menu-item {
            display: flex;
            align-items: center;
            background-color: #ffffff;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            text-decoration: none;
            color: #374151;
            transition: all 0.2s ease-in-out;
            box-sizing: border-box;
        }

        /* Efecto al pasar el mouse por encima o presionar en móviles */
        .menu-item:hover {
            border-color: #1e3a8a;
            background-color: #f8fafc;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(30, 58, 138, 0.08);
        }

        .menu-icon { font-size: 24px; margin-right: 15px; width: 30px; text-align: center; }
        .menu-text { display: flex; flex-direction: column; flex-grow: 1; }
        .menu-title { font-weight: bold; color: #1e3a8a; font-size: 16px; }
        .menu-desc { font-size: 12px; color: #6b7280; margin-top: 2px; }
        .menu-arrow { color: #9ca3af; font-size: 18px; font-weight: bold; }

        /* OPTIMIZACIÓN RESPONSIVA EXTRA (Ajustes finos para 360px de ancho) */
        @media screen and (max-width: 360px) {
            body { padding: 10px; }
            .container { padding: 15px; }
            .menu-item { padding: 12px; }
            .menu-title { font-size: 15px; }
            .menu-desc { font-size: 11px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-panel">
        <h1>Control de Vales Digitales</h1>
        <p>Panel de Administración y Operaciones FFyL</p>
    </div>

    <div id="contenedor-menu" class="menu-grid"></div>
</div>

<script src="menu.js"></script>
</body>
</html>
