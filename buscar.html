<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Vales por Área</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #1e3a8a; margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .filter-box { margin-bottom: 25px; display: flex; flex-direction: column; gap: 8px; }
        label { font-weight: bold; color: #475569; }
        select { padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; width: 100%; max-width: 400px; background-color: #fff; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; display: none; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #475569; }
        .badge { padding: 5px 10px; border-radius: 20px; font-size: 13px; font-weight: bold; text-transform: uppercase; }
        .badge.cumple { background: #dcfce7; color: #166534; }
        .badge.nocumple { background: #fee2e2; color: #991b1b; }
        #status-message { margin-top: 15px; font-weight: bold; color: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏢 Consulta de Consumo de Vales por Área</h2>
    
    <div class="filter-box">
        <label for="select-area">Selecciona un Área de Responsabilidad:</label>
        <select id="select-area">
            <option value="">Cargando áreas disponibles... ⏳</option>
        </select>
    </div>

    <div id="status-message"></div>

    <table id="tabla-usuarios">
        <thead>
            <tr>
                <th>ID / Número</th>
                <th>Nombre Completo</th>
                <th>Estatus Financiero</th>
                <th>Asignados</th>
                <th>Consumidos</th>
                <th>Disponibles</th>
            </tr>
        </thead>
        <tbody id="cuerpo-tabla">
            </tbody>
    </table>
</div>

<script src="areas.js"></script>
</body>
</html>
