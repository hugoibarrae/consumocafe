<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Usuarios y Vales</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f7fa; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h2 { color: #1e3a8a; margin-top: 0; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
        .control-panel { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 25px; background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0; }
        .group { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 250px; }
        label { font-weight: bold; color: #475569; font-size: 14px; }
        input[type="text"], select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 15px; background: white; }
        .btn { background: #1d4ed8; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 15px; }
        .btn:hover { background: #1e40af; }
        .btn-edit { background: #0ea5e9; padding: 6px 12px; font-size: 13px; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-edit:hover { background: #0369a1; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; display: none; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { background: #f1f5f9; color: #475569; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge.cumple { background: #dcfce7; color: #166534; }
        .badge.nocumple { background: #fee2e2; color: #991b1b; }
        #msg { font-weight: bold; color: #4b5563; margin: 15px 0; }

        /* Estilos del Formulario de Edición Emergente (Modal) */
        .modal { display: none; position: fixed; z-index: 100; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); }
        .modal-content { background: white; margin: 10% auto; padding: 25px; border-radius: 8px; width: 100%; max-width: 500px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancel { background: #94a3b8; color: white; }
        .btn-cancel:hover { background: #64748b; }
    </style>
</head>
<body>

<div class="container">
    <h2>⚙️ Panel de Administración y Edición de Personal</h2>
    
    <div class="control-panel">
        <div class="group">
            <label>Filtrar por Área de Responsabilidad:</label>
            <select id="select-area">
                <option value="">Cargando áreas... ⏳</option>
            </select>
        </div>
        <br>
        <div class="group">
            <label>O buscar por Nombre / Apellido / Matrícula / IDQR:</label>
            <div style="display:flex; gap:8px;">
                <input type="text" id="txt-buscar" placeholder="Escribe para buscar...">
                <button class="btn" id="btn-buscar">Buscar</button>
            </div>
        </div>
    </div>

    <div id="msg"></div>

    <table id="tabla-usuarios">
        <thead>
            <tr>
                <th>IDQR</th>
                <th>Nombre Completo</th>
                <th>Área</th>
                <th>Asignados</th>
                <th>Consumidos</th>
                <th>Disponibles</th>
                <th>Estatus</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="cuerpo-tabla"></tbody>
    </table>
</div>

<div id="form-modal" class="modal">
    <div class="modal-content">
        <h3 style="margin-top:0; color:#1e3a8a;">✏️ Editar Parámetros de Usuario</h3>
        <input type="hidden" id="edit-index">
        
        <div class="group" style="margin-bottom:12px;">
            <label>Nombre(s):</label>
            <input type="text" id="edit-nombre">
        </div>
        <div class="group" style="margin-bottom:12px;">
            <label>Apellido Paterno:</label>
            <input type="text" id="edit-pat">
        </div>
        <div class="group" style="margin-bottom:12px;">
            <label>Apellido Materno:</label>
            <input type="text" id="edit-mat">
        </div>
        <div class="group" style="margin-bottom:12px;">
            <label>Área:</label>
            <input type="text" id="edit-area">
        </div>
        <div class="group" style="margin-bottom:12px;">
            <label>Correo Electrónico:</label>
            <input type="text" id="edit-correo">
        </div>
        <div class="group" style="margin-bottom:12px;">
            <label>Vales Asignados (Mes):</label>
            <input type="text" id="edit-asignados">
        </div>

        <div class="modal-actions">
            <button class="btn btn-cancel" id="btn-cerrar-modal">Cancelar</button>
            <button class="btn" id="btn-guardar" style="background:#16a34a;">Guardar Cambios</button>
        </div>
    </div>
</div>

<script src="buscar.js"></script>
</body>
</html>
