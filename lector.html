<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector QR Express v2 - Producción</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-light p-3">

    <div style="max-width: 360px; margin: auto; text-align: center; background-color: darkorange; padding: 15px; border-radius: 8px;" class="shadow-sm">
        <h1 style="color: white; margin-bottom: 15px;" class="fw-bold fs-3">Escáner QR</h1>
        
        <button class="btn btn-sm btn-dark w-100 mb-3 fw-bold shadow-sm" onclick="abrirModalConsumos()">
            <i class="fa-solid fa-list-check text-warning me-1"></i> Ver/Borrar Consumos de Hoy
        </button>

        <div id="reader" style="width: 100%; border-radius: 6px; overflow: hidden;" class="bg-dark"></div>
        
        <div id="result" style="margin-top: 20px; font-weight: bold; color: #2c3e50;"></div>
    </div>

    <div style="max-width: 360px; margin: auto;" class="mt-3">
        <div id="contador-dia" style="padding: 10px; background: #f8f9fa; border-radius: 5px; border: 1px solid #ddd; font-weight: bold; color: #555;" class="text-center">
            Registros de hoy: <span id="num-total" class="text-primary">Cargando...</span>
        </div>

        <div id="panel-vales-alumno" style="display: none; padding: 10px; background: #e3f2fd; border-radius: 5px; border: 1px solid #90caf9; font-weight: bold; color: #0d47a1;" class="text-center mt-2 shadow-sm">
            El alumno lleva consumidos hoy: <span id="num-vales-alumno" class="fs-5 text-danger">0</span> vales
        </div>

        <div id="result-container" style="margin-top: 20px;" class="text-center">
            <p id="status-text" class="text-secondary small fw-bold">Esperando escaneo...</p>
            <button id="btn-enviar" disabled class="btn btn-primary w-100 fw-bold" style="padding: 10px 20px;">
                Enviar a Excel
            </button>
        </div>

        <p class="text-center mt-3">
            <button class="btn btn-light border btn-sm shadow-sm">
                <a href="https://docs.google.com/spreadsheets/d/e/2PACX-1vTzpirtuSIlulYitaHen2z2DJO8Z_Ex_0RFYqnRHszXaELiZvRK6SUYVNBZ1osHeRp7RWO35frGBPxg/pubhtml?gid=0&single=true" target="_blank" class="text-decoration-none text-dark fw-bold">
                    <i class="fa-solid fa-table text-success me-1"></i> Ver tabla consumos
                </a>
            </button>
        </p>

        <hr>
        <div class="bg-white p-3 rounded border text-center shadow-sm">
            <h5 class="fw-bold text-secondary" style="font-size: 14px; text-transform: uppercase;">Generar Reporte Diario</h5>
            <input type="date" id="fecha-reporte" class="form-control form-control-sm mb-2 text-center border-primary">
            <button id="btn-email-reporte" class="btn btn-sm btn-outline-dark w-100 fw-bold">📧 Enviar por Correo</button>
        </div>

        <div style="margin-top:20px; display: flex; align-items: center; justify-content: center; gap: 10px;">
            <button id="btn-refresh" style="background: none; border: 1px solid #ccc; border-radius: 4px; cursor: pointer; padding: 5px 10px; font-size: 14px; display: flex; align-items: center; gap: 5px;" onclick="location.reload()">
                🔄 Actualizar Pantalla
            </button>
        </div>
    </div>

    <div class="modal fade" id="modalConsumos" data-bs-backdrop="static" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-scrollable" style="max-width: 400px;">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white py-2">
                    <h6 class="modal-title fw-bold"><i class="fa-solid fa-calendar-day text-info me-2"></i>Consumos de Hoy</h6>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-2">
                    <div class="input-group input-group-sm mb-2">
                        <span class="input-group-text"><i class="fa-solid fa-magnifying-glass"></i></span>
                        <input type="text" class="form-control" id="txtBuscadorConsumos" placeholder="Buscar por Matrícula o IDQR..." onkeyup="filtrarConsumosEnPantalla()">
                    </div>
                    
                    <div class="table-responsive">
                        <table class="table table-sm table-striped align-middle mb-0" style="font-size: 12px;">
                            <thead class="table-light">
                                <tr>
                                    <th>Usuario / IDQR</th>
                                    <th>Hora</th>
                                    <th class="text-center">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="tbodyConsumosHoy">
                                <tr><td colspan="3" class="text-center text-muted">Cargando datos...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lector_logica.js"></script>

<script>
    

    
</script>


</body>
</html>
