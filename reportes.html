        },
        month: { type: 'select', value: "Enero", options: ["Enero", "Febrero", "Marzo"], label: "Mes" },
        areaFilter: { type: 'select', value: "Todas", options: ["Todas", "Administrativo", "Directivo", "Deportes"], label: "Área" },
        userSearch: { type: 'text', value: "", label: "Buscar Usuario" }
    },
    internal_state: {
        matrixRaw: [
            { id: 1, area: 'Administrativo', personas: 15, asignados: 300, month: 'Enero' },
            { id: 2, area: 'Directivo', personas: 5, asignados: 100, month: 'Enero' },
            { id: 3, area: 'Deportes', personas: 40, asignados: 800, month: 'Enero' },
            { id: 4, area: 'Administrativo', personas: 15, asignados: 320, month: 'Febrero' },
            { id: 5, area: 'Directivo', personas: 5, asignados: 100, month: 'Febrero' },
            { id: 6, area: 'Deportes', personas: 40, asignados: 850, month: 'Febrero' }
        ],
        historyRaw: [
            { user: 'Olga Mayte', area: 'Administrativo', date: '2026-01-05', vales: 1 },
            { user: 'Olga Mayte', area: 'Administrativo', date: '2026-01-06', vales: 1 },
            { user: 'Olga Mayte', area: 'Administrativo', date: '2026-01-10', vales: 2 },
            { user: 'Karen Alondra', area: 'Deportes', date: '2026-01-12', vales: 3 }, // Alerta
            { user: 'Juan Perez', area: 'Deportes', date: '2026-01-12', vales: 1 },
            { user: 'Karen Alondra', area: 'Deportes', date: '2026-01-15', vales: 2 },
            { user: 'Olga Mayte', area: 'Administrativo', date: '2026-02-01', vales: 1 },
            { user: 'Luis Gomez', area: 'Directivo', date: '2026-01-20', vales: 3 }, // Alerta
            { user: 'Carlos Martínez', area: 'Deportes', date: '2026-01-22', vales: 1 },
            { user: 'Sofía Rodríguez', area: 'Administrativo', date: '2026-01-28', vales: 1 }
        ],
        filteredMatrix: [],
        filteredHistory: [],
        alertsList: [],
        selectedUserProfile: {},
        selectedUserUsed: 0
    },
    sizing: { viz: { height: 600 } },
    editorial: {
        hud: [
            { label: "Eficiencia Promedio", value: "84%" },
            { label: "Alertas Activas", value: "2" }
        ]
    }
});

const [vPlot, vTable] = ui.buildStack([
    { id: 'viz-plot', height: 240 },
    { id: 'viz-table', height: 320 }
]);

const updateCalculations = () => {
    // 1. Matriz logic
    const baseMatrix = state.matrixRaw.filter(d => d.month === state.month);
    
    // Simulate usage for diversity
    const processedMatrix = baseMatrix.map(row => {
        const seed = row.id * 13;
        const usado = Math.floor(row.asignados * (0.75 + (seed % 20) / 100));
        const diff = row.asignados - usado;
        const pct = row.asignados > 0 ? (usado / row.asignados) : 0;
        return { ...row, usado, diff, pct };
    });

    state.filteredMatrix = state.areaFilter === 'Todas' 
        ? processedMatrix 
        : processedMatrix.filter(d => d.area === state.areaFilter);

    // 2. History logic & User Configuration Retrieval (Google Sheets Link)
    const query = state.userSearch.toLowerCase().trim();
    // Default to 'Olga Mayte' if the user hasn't typed anything, to keep the UI engaging
    const targetUser = query === "" ? "olga mayte" : query;

    // Retrieve user allocation based on their activity from previous Sheet Config
    const userConfig = CONFIG_VALES_USUARIOS.find(u => 
        u.user.toLowerCase().includes(targetUser)
    ) || { 
        user: query === "" ? "Olga Mayte" : state.userSearch, 
        area: "Deportes", 
        actividad: "Auxiliar Técnico Deportivo", 
        asignadoMes: 3 
    };

    state.selectedUserProfile = userConfig;

    // Filter transaction logs for searched user
    const historyForUser = state.historyRaw.filter(h => 
        h.user.toLowerCase().includes(userConfig.user.toLowerCase())
    );

    // Get exact month index (0: Ene, 1: Feb, 2: Mar)
    const currentMonthIdx = state.month === 'Enero' ? 0 : state.month === 'Febrero' ? 1 : 2;

    // Filter table records by search query and selected month
    state.filteredHistory = state.historyRaw.filter(h => {
        const matchesUser = h.user.toLowerCase().includes(state.userSearch.toLowerCase());
        const matchesMonth = new Date(h.date).getMonth() === currentMonthIdx;
        return matchesUser && matchesMonth;
    });

    // Sum of used vouchers this month
    const usedThisMonth = historyForUser
        .filter(h => new Date(h.date).getMonth() === currentMonthIdx)
        .reduce((sum, h) => sum + h.vales, 0);

    state.selectedUserUsed = usedThisMonth;

    // 3. Alerts logic
    state.alertsList = state.historyRaw.filter(h => h.vales >= 3);

    // Update HUD & Editorial content based on active tab
    const totalAsignados = processedMatrix.reduce((acc, curr) => acc + curr.asignados, 0);
    const totalUsado = processedMatrix.reduce((acc, curr) => acc + curr.usado, 0);
    const avgEf = totalAsignados > 0 ? (totalUsado / totalAsignados * 100).toFixed(0) : 0;

    if (state.tab === "2. Búsqueda de Usuarios") {
        ui.setEditorial({
            hero: `${userConfig.user}`,
            subHero: `Puesto/Actividad: ${userConfig.actividad} | Área: ${userConfig.area}`,
            details: `Rescatado de Google Sheets: Asignación base para esta actividad: ${userConfig.asignadoMes} vales/mes.\nRegistros en ${state.month}: Consumido ${usedThisMonth} de ${userConfig.asignadoMes} vales (${((usedThisMonth / userConfig.asignadoMes) * 100).toFixed(0)}% de uso).`,
            hud: [
                { label: "Asignación (Config)", value: `${userConfig.asignadoMes} Vales`, color: "#003B7C" },
                { label: "Usados este Mes", value: `${usedThisMonth} Vales`, color: "#ffd100" }
            ]
        });
    } else if (state.tab === "3. Alertas") {
        ui.setEditorial({
            hero: "Panel de Monitoreo de Alertas de Consumo",
            subHero: "Filtro de transacciones con ≥ 3 vales solicitados simultáneamente",
            details: "Consulte el historial de consumos que igualan o exceden el límite de alerta establecido para vigilar el comportamiento de asignación.",
            hud: [
                { label: "Alertas Detectadas", value: state.alertsList.length.toString(), color: "--error" },
                { label: "Eficiencia General", value: `${avgEf}%` }
            ]
        });
    } else {
        // Tab 1: Vista General
        ui.setEditorial({
            hero: `Eficiencia de Control - ${state.month}`,
            subHero: `Área: ${state.areaFilter}`,
            details: "Monitoreo global de presupuestos. Contraste de vales asignados por administración versus vales efectivamente ejercidos en canchas y oficinas.",
            hud: [
                { label: "Eficiencia General", value: `${avgEf}%` },
                { label: "Alertas de Consumo", value: state.alertsList.length.toString(), color: "--error" }
            ]
        });
    }
};

// Initial calculations run
updateCalculations();

// Reactivity mapping
state._subscribe('month', updateCalculations);
state._subscribe('areaFilter', updateCalculations);
state._subscribe('userSearch', updateCalculations);
state._subscribe('tab', updateCalculations);

WH.initPlot(vPlot, ({ width, state }) => {
    if (state.tab === "1. Matriz de Eficiencia" || state.tab === "1. Vista General y Áreas") {
        return {
            width,
            marginLeft: 110,
            color: { range: ["#003B7C", "#ffd100", "#00639b"] },
            x: { label: "Uso (%)", domain: [0, 1.1], tickFormat: "%" },
            y: { label: null },
            marks: [
                Plot.barX(state.filteredMatrix, { 
                    x: "pct", 
                    y: "area", 
                    fill: "area", 
                    tip: true 
                }),
                Plot.ruleX([1], { stroke: "var(--outline)", strokeDasharray: "4,4" }),
                Plot.text(state.filteredMatrix, { 
                    x: "pct", 
                    y: "area", 
                    text: d => (d.pct * 100).toFixed(0) + '%', 
                    dx: 15,
                    fill: "var(--on-surface-default)" 
                })
            ]
        };
    } else if (state.tab === "2. Búsqueda de Usuarios") {
        // Contrast of configuration vs actual usage
        const compareData = [
            { categoria: "1. Asignados (Config anterior)", cantidad: state.selectedUserProfile.asignadoMes, color: "Asignados" },
            { categoria: "2. Consumidos (Mes actual)", cantidad: state.selectedUserUsed, color: "Consumidos" }
        ];

        return {
            width,
            marginLeft: 170,
            color: {
                domain: ["Asignados", "Consumidos"],
                range: ["#ffd100", "#003B7C"] // UANL Yellow (Gold) and Blue
            },
            x: { label: "Cantidad de Vales", domain: [0, Math.max(10, state.selectedUserProfile.asignadoMes + 2)] },
            y: { label: null },
            marks: [
                Plot.barX(compareData, {
                    x: "cantidad",
                    y: "categoria",
                    fill: "color",
                    tip: true
                }),
                Plot.text(compareData, {
                    x: "cantidad",
                    y: "categoria",
                    text: d => `${d.cantidad} Vales`,
                    dx: 15,
                    fill: "var(--on-surface-default)",
                    fontWeight: "bold"
                })
            ]
        };
    } else {
        // Tab Alertas
        return {
            width,
            x: { label: "Usuario" },
            y: { label: "Vales de Alerta" },
            marks: [
                Plot.barY(state.alertsList, { 
                    x: "user", 
                    y: "vales", 
                    fill: "var(--error)", 
                    tip: true 
                }),
                Plot.ruleY([2.5], { stroke: "var(--error)", strokeWidth: 2, strokeDasharray: "4,4" })
            ]
        };
    }
}, { height: 240 });

WH.initTable(vTable, ({ state }) => {
    if (state.tab === "1. Matriz de Eficiencia" || state.tab === "1. Vista General y Áreas") {
        return {
            data: state.filteredMatrix,
            columns: [
                { key: 'area', label: 'Área Deportiva' },
                { key: 'personas', label: 'Personal Activo' },
                { key: 'asignados', label: 'Presupuesto Asignado' },
                { key: 'usado', label: 'Vales Ejercidos' },
                { key: 'diff', label: 'Diferencia', format: v => v > 0 ? `+${v}` : v },
                { key: 'pct', label: 'Porcentaje Uso', format: v => (v * 100).toFixed(1) + '%' }
            ]
        };
    } else if (state.tab === "2. Búsqueda de Usuarios") {
        return {
            data: state.filteredHistory,
            highlightCondition: (row) => row.vales >= 3 ? 'error' : null,
            columns: [
                { key: 'date', label: 'Fecha de Registro' },
                { key: 'user', label: 'Usuario Coordinado' },
                { key: 'area', label: 'Área' },
                { key: 'vales', label: 'Vales Consumidos', format: v => `${v} Vales` }
            ]
        };
    } else {
        // Tab Alertas
        return {
            data: state.alertsList,
            highlightCondition: (row) => row.vales >= 3 ? 'error' : null,
            columns: [
                { key: 'date', label: 'Fecha' },
                { key: 'user', label: 'Usuario Coordinado' },
                { key: 'area', label: 'Área' },
                { key: 'vales', label: 'Cantidad Alerta', format: v => `⚠️ ${v} Vales en una transacción` }
            ]
        };
    }
});
</script>
