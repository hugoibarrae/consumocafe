<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Sistema de Administración</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #002F6C;
      --primary-hover: #001f48;
      --surface: #ffffff;
      --bg-body: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 12px;
      --shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      --danger: #dc2626;
      --success: #16a34a;
      --purple: #7c3aed;
      --amber: #d97706;
      --emerald: #059669;
      --blue: #2563eb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      padding: 2.5rem 2rem;
    }

    .login-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .login-header .icon {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
      display: inline-block;
    }

    .login-header h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--primary);
    }

    .login-header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
    }

    .form-group label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .form-control {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      width: 100%;
      background-color: #ffffff;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 47, 108, 0.15);
    }

    .pass-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pass-input-wrapper input {
      padding-right: 2.5rem;
    }

    .btn-eye {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      opacity: 0.6;
      transition: opacity 0.2s;
    }

    .btn-eye:hover { opacity: 1; }

    .btn-submit {
      width: 100%;
      padding: 0.85rem;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
    }

    .btn-submit:active {
      transform: scale(0.99);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    /* Botones dinámicos según Rol */
    .btn-action-role {
      margin-top: 0.75rem;
    }

    .btn-superadmin {
      background-color: var(--purple);
    }
    .btn-superadmin:hover {
      background-color: #6d28d9;
    }

    .btn-admin {
      background-color: var(--amber);
    }
    .btn-admin:hover {
      background-color: #b45309;
    }

    .btn-operator {
      background-color: var(--emerald);
    }
    .btn-operator:hover {
      background-color: #047857;
    }

    .btn-reports {
      background-color: var(--blue);
    }
    .btn-reports:hover {
      background-color: #1d4ed8;
    }

    .alert-message {
      margin-top: 1.25rem;
      padding: 0.75rem;
      border-radius: 8px;
      font-size: 0.875rem;
      text-align: center;
      display: none;
    }

    .alert-message.error {
      background-color: #fef2f2;
      color: var(--danger);
      border: 1px solid #fecaca;
      display: block;
    }

    .alert-message.success {
      background-color: #f0fdf4;
      color: var(--success);
      border: 1px solid #bbf7d0;
      display: block;
    }

    /* Estilos del Panel del Perfil */
    .user-profile-box {
      margin-top: 1.5rem;
      padding: 1.25rem;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 10px;
    }

    .user-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
    }

    .user-header h4 {
      font-size: 1.05rem;
      color: var(--primary);
    }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .badge-superadmin { background-color: #f3e8ff; color: var(--purple); border: 1px solid #d8b4fe; }
    .badge-admin { background-color: #fef3c7; color: var(--amber); border: 1px solid #fde68a; }
    .badge-user { background-color: #e0f2fe; color: #0284c7; border: 1px solid #bae6fd; }

    .permissions-container {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--border-color);
    }

    .permissions-title {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .permission-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .tag {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      color: #334155;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <span class="icon">🔐</span>
      <h1>Acceso al Sistema</h1>
      <p>Selecciona tu usuario e ingresa tu contraseña</p>
    </div>

    <form id="formLogin" onsubmit="realizarLogin(event)">
      <div class="form-group">
        <label for="selectUsuario">Usuario</label>
        <select id="selectUsuario" class="form-control" required disabled>
          <option value="" disabled selected>Cargando usuarios...</option>
        </select>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="pass-input-wrapper">
          <input type="password" id="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="btn-eye" onclick="togglePasswordVisibility()">👁️</button>
        </div>
      </div>

      <button type="submit" id="btnSubmit" class="btn-submit">Iniciar Sesión</button>
    </form>

    <div id="alertMsg" class="alert-message"></div>

    <!-- Panel de Perfil tras Inicio de Sesión -->
    <div id="userInfo" class="user-profile-box" style="display: none;">
      <div class="user-header">
        <h4 id="userName"></h4>
        <span id="roleBadge" class="badge"></span>
      </div>

      <p id="userArea" style="font-size: 0.85rem; color: var(--text-muted);"></p>

      <div class="permissions-container">
        <div class="permissions-title">ÁREAS / PERMISOS ASIGNADOS:</div>
        <div id="permissionTags" class="permission-tags"></div>
      </div>

      <!-- Contenedor de Botones según el Rol y Permisos -->
      <div id="roleActions">
        <button id="btnVerBeneficiarios" onclick="abrirAdmins()" class="btn-submit btn-action-role btn-operator" style="display: none;">
          👥 VER BENEFICIARIOS
        </button>

        <button id="btnReportesMensuales" onclick="abrirReportesMensuales()" class="btn-submit btn-action-role btn-reports" style="display: none;">
          📊 REPORTES MENSUALES
        </button>

        <button id="btnMatriz" onclick="abrirMatrizPermisos()" class="btn-submit btn-action-role btn-superadmin" style="display: none;">
          ⚡ Editar Matriz de Permisos
        </button>

        
      </div>

      <button onclick="cerrarSesion()" class="btn-submit" style="background-color: #64748b; margin-top: 0.75rem; padding: 0.6rem;">
        Cerrar Sesión
      </button>
    </div>
  </div>

  
  <script>
    const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbytCA765PovkLdcz7lAWUY-PZwnGLcF31hYjyLpXZWETEZPDnM7TJ9U3GobGzBvSfJQ/exec";

    // 1. CARGAR USUARIOS AL INICIAR LA PÁGINA (Vía GET a doGet)
    document.addEventListener("DOMContentLoaded", () => {
      cargarUsuarios();
    });

    async function cargarUsuarios() {
      const select = document.getElementById("selectUsuario");
      mostrarAlerta("", "");

      try {
        // Llamada vía GET directa para evitar bloqueos CORS/POST de lectura
        const response = await fetch(URL_WEB_APP, {
          method: "GET",
          redirect: "follow"
        });

        const data = await response.json();

        if (data.status === "success" && Array.isArray(data.usuarios)) {
          select.innerHTML = '<option value="" disabled selected>-- Selecciona un usuario --</option>';
          
          data.usuarios.forEach(item => {
            const option = document.createElement("option");
            option.value = item.usuario;
            option.textContent = item.usuario + (item.area ? ` (${item.area})` : '');
            select.appendChild(option);
          });

          select.disabled = false;
        } else {
          mostrarAlerta("error", "Error al cargar usuarios: " + (data.message || "Estructura de respuesta no válida"));
          select.innerHTML = '<option value="" disabled selected>Error al cargar usuarios</option>';
        }
      } catch (err) {
        console.error("Error de conexión:", err);
        mostrarAlerta("error", "Error de red al conectar con el servidor.");
        select.innerHTML = '<option value="" disabled selected>Error de red</option>';
      }
    }

    // 2. EJECUTAR EL LOGIN AL ENVIAR FORMULARIO (Vía POST)
    async function realizarLogin(e) {
      e.preventDefault();
      
      const usuario = document.getElementById("selectUsuario").value;
      const password = document.getElementById("password").value;
      const btnSubmit = document.getElementById("btnSubmit");

      if (!usuario || !password) {
        mostrarAlerta("error", "Por favor completa todos los campos.");
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = "Verificando...";
      mostrarAlerta("", "");

      try {
        const respuesta = await fetch(URL_WEB_APP, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          redirect: "follow", // <--- CRÍTICO: Permite seguir el redireccionamiento de Google
          body: JSON.stringify({
            action: "login",
            usuario: usuario,
            password: password
          })
        });

        const data = await respuesta.json();

        if (data.status === "success") {
          mostrarAlerta("success", data.message);
          renderPerfilUsuario(data.usuario);
        } else {
          mostrarAlerta("error", "❌ " + data.message);
        }
      } catch (err) {
        console.error(err);
        mostrarAlerta("error", "Error de red al intentar iniciar sesión.");
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.textContent = "Iniciar Sesión";
      }
    }

    // 3. DESPLEGAR DATOS DE USUARIO EN PANTALLA TRAS EL LOGIN
    function renderPerfilUsuario(user) {
      document.getElementById("formLogin").style.display = "none";
      document.getElementById("userInfo").style.display = "block";

      document.getElementById("userName").textContent = user.usuario;
      document.getElementById("userArea").textContent = "Área: " + (user.area || "No especificada");

      // Badge de Rol
      const roleBadge = document.getElementById("roleBadge");
      roleBadge.textContent = user.rol;
      roleBadge.className = "badge ";

      if (user.esSuperAdmin) {
        roleBadge.classList.add("badge-superadmin");
      } else if (user.esAdminSistema) {
        roleBadge.classList.add("badge-admin");
      } else {
        roleBadge.classList.add("badge-user");
      }

      // Permisos / Áreas
      const tagsContainer = document.getElementById("permissionTags");
      tagsContainer.innerHTML = "";
      
      if (user.areasAsignadas && user.areasAsignadas.length > 0) {
        user.areasAsignadas.forEach(area => {
          const span = document.createElement("span");
          span.className = "tag";
          span.textContent = area;
          tagsContainer.appendChild(span);
        });
      } else {
        tagsContainer.innerHTML = "<span class='tag'>Sin áreas asignadas</span>";
      }

      // Visibilidad de Botones de Acción
      document.getElementById("btnVerBeneficiarios").style.display = "block";
      document.getElementById("btnReportesMensuales").style.display = (user.esSuperAdmin || user.esAdminSistema) ? "block" : "none";
      document.getElementById("btnMatriz").style.display = user.esSuperAdmin ? "block" : "none";
      document.getElementById("btnEnviarQR").style.display = user.esAdminSistema ? "block" : "none";
    }

    // 4. CERRAR SESIÓN
    function cerrarSesion() {
      document.getElementById("formLogin").reset();
      document.getElementById("formLogin").style.display = "block";
      document.getElementById("userInfo").style.display = "none";
      mostrarAlerta("", "");
    }

    // 5. FUNCIONES AUXILIARES
    function togglePasswordVisibility() {
      const input = document.getElementById("password");
      input.type = input.type === "password" ? "text" : "password";
    }

    function mostrarAlerta(tipo, mensaje) {
      const alertBox = document.getElementById("alertMsg");
      if (!mensaje) {
        alertBox.style.display = "none";
        alertBox.className = "alert-message";
        return;
      }
      alertBox.className = `alert-message ${tipo}`;
      alertBox.textContent = mensaje;
    }

    // Placeholders de navegación
    function abrirAdmins() { window.location.href = "inscritos.html";}
    function abrirReportesMensuales() {  window.location.href = "https://script.google.com/a/macros/sistemasinternosffyl.com/s/AKfycbz1eoPYh-WhYt9oMPNE4rut5_iOkV-E5O9XRrF4vA-OqY-6einAjFSVsUeSdQ_CDaIa/exec"; }
    function abrirMatrizPermisos() { window.location.href = "matriz-usuarios.html"; }
    function abrirEnviarQR() { alert("Navegando a Envío de QR..."); }
  </script>


</body>
</html>
