<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Administración - Registro de Usuarios</title>
  <style>
    /* ==========================================================================
       ESTILOS BASE
       ========================================================================== */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 20px 10px;
      color: #374151;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      background: #ffffff;
      padding: 25px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 100%;
    }

    h2 {
      color: #1e3a8a;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 10px;
      margin-top: 0;
      font-size: 1.4rem;
      text-align: center;
    }

    /* ==========================================================================
       SECCIÓN DE FILTROS Y BÚSQUEDA
       ========================================================================== */
    .filter-panel {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
    }

    .filter-panel h3 {
      margin: 0 0 10px 0;
      font-size: 1rem;
      color: #1e3a8a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ==========================================================================
       CAMPOS E INPUTS
       ========================================================================== */
    .field {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #374151;
      font-size: 0.9rem;
    }

    input[type="text"],
    input[type="number"],
    input[type="email"],
    select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
      background-color: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus, select:focus {
      border-color: #2563eb;
      outline: none;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    input[readonly] {
      background-color: #e5e7eb;
      color: #4b5563;
      font-weight: bold;
      cursor: not-allowed;
      border-color: #cbd5e1;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    /* ==========================================================================
       BOTONES Y MENSAJES DE ESTADO
       ========================================================================== */
    .btn-submit {
      background-color: #1e3a8a;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: background-color 0.2s;
    }

    .btn-submit:hover {
      background-color: #1d4ed8;
    }

    .btn-submit:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    #status-message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      text-align: center;
      display: none;
      font-size: 0.9rem;
    }

    .success { background-color: #def7ec; color: #03543f; }
    .error { background-color: #fde8e8; color: #9b1c1c; }
    .info { background-color: #e1effe; color: #1e429f; }

    /* Contenedor para lista de resultados filtrados */
    .results-container {
      margin-top: 15px;
      max-height: 280px;
      overflow-y: auto;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      display: none;
    }

    .user-card {
      padding: 10px 12px;
      border-bottom: 1px solid #f1f5f9;
      background: #fff;
    }

    .user-card:last-child {
      border-bottom: none;
    }

    .user-card-title {
      font-weight: bold;
      color: #1e3a8a;
      font-size: 0.95rem;
    }

    .user-card-sub {
      font-size: 0.82rem;
      color: #64748b;
    }

    /* ==========================================================================
       RESPONSIVIDAD MÓVIL CRÍTICA (MAX-WIDTH: 380PX)
       ========================================================================== */
    @media screen and (max-width: 380px) {
      body {
        padding: 8px 4px;
      }

      .container {
        padding: 14px 10px;
        border-radius: 6px;
      }

      h2 {
        font-size: 1.15rem;
        padding-bottom: 8px;
      }

      /* Colapsar todos los grids a una columna única */
      .grid-2 {
        grid-template-columns: 1fr !important;
        gap: 10px;
      }

      .filter-panel {
        padding: 10px;
      }

      input[type="text"],
      input[type="number"],
      input[type="email"],
      select {
        font-size: 15px; /* Evita auto-zoom en iOS Safari */
        padding: 8px 10px;
      }

      .btn-submit {
        padding: 10px 14px;
        font-size: 15px;
      }

      label {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  
  <!-- PANEL SUPERIOR: BÚSQUEDA Y FILTRADO POR ACTIVIDAD -->
  <div class="filter-panel" id="secFiltrosBusqueda">
    <h3>🔍 Búsqueda y Filtros</h3>
    
    <div class="grid-2">
      <div class="field" style="margin-bottom: 0;">
        <label for="searchBar">Buscar Participante:</label>
        <input 
          type="text" 
          id="searchBar" 
          placeholder="Nombre, ID o Matrícula..." 
          oninput="filtrarParticipantes()" 
        />
      </div>

      <div class="field" style="margin-bottom: 0;">
        <label for="filterActivity">Filtrar por Actividad:</label>
        <select id="filterActivity" onchange="filtrarParticipantes()">
          <option value="">-- Todas las actividades --</option>
        </select>
      </div>
    </div>

    <!-- Resultados dinámicos de búsqueda -->
    <div id="listaResultados" class="results-container"></div>
  </div>

  <!-- FORMULARIO DE REGISTRO DE USUARIOS -->
  <form id="formRegistro">
    <h2>📝 Registro de Usuarios</h2>

    <div class="field">
      <label for="txtNombre">Nombre(s):</label>
      <input type="text" id="txtNombre" name="Nombre" required placeholder="Ej. Juan Carlos" oninput="generarIdQR()">
    </div>

    <div class="grid-2">
      <div class="field">
        <label for="txtPaterno">Apellido Paterno:</label>
        <input type="text" id="txtPaterno" name="ApellidoPaterno" required placeholder="Ej. Ibarra" oninput="generarIdQR()">
      </div>
      <div class="field">
        <label for="txtMaterno">Apellido Materno:</label>
        <input type="text" id="txtMaterno" name="ApellidoMaterno" placeholder="Ej. Elizondo" oninput="generarIdQR()">
      </div>
    </div>

    <div class="grid-2">
      <div class="field">
        <label for="selectArea">Área de Responsabilidad (Area1):</label>
        <select id="selectArea" name="Area1" required>
          <option value="">Cargando áreas...</option>
        </select>
      </div>

      <div class="field">
        <label for="selectActividad">Actividad Asignada (Actividad1):</label>
        <select id="selectActividad" name="Actividad1" disabled required>
          <option value="">-- Primero selecciona un Área --</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="txtMatricula">Matrícula o Número de Empleado:</label>
      <input type="text" id="txtMatricula" name="Matricula" required placeholder="Ej. 1740885" maxlength="15" oninput="generarIdQR()">
    </div>

    <div class="field">
      <label for="txtIdQR">Código / ID QR Generado:</label>
      <input type="text" id="txtIdQR" name="IdQR" readonly placeholder="Se autocompletará...">
    </div>

    <div class="field">
      <label for="txtCorreoEdu">Correo Institucional (@uanl.edu.mx):</label>
      <input type="email" id="txtCorreoEdu" name="CorreoEdu" required placeholder="Ej. juan.perez@uanl.edu.mx">
    </div>

    <div class="field">
      <label for="txtCorreoAlt">Correo Alterno:</label>
      <input type="email" id="txtCorreoAlt" name="Correo" placeholder="Ej. juan.perez@hotmail.com">
    </div>

    <div class="field">
      <label for="inputVales">Vales Asignados (Este mes):</label>
      <input type="number" id="inputVales" name="ASIGNADOS" value="0" readonly style="background-color: #e9ecef; font-weight: bold;">
    </div>

    <button type="submit" class="btn-submit" id="btnGuardar">Guardar en Base de Datos</button>
  </form>

  <div id="status-message"></div>
</div>

<!-- ARCHIVO JAVASCRIPT EXTERNO -->
<script src="appcopia4.js"></script>
</body>
</html>
